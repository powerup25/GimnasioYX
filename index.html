<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beneficios | Gimnasio YX</title>
<meta name="theme-color" content="#16191e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============ AJUSTES ============ */
/* Colores tomados de la gráfica de YX */
:root{
  --bg:#16191e;
  --surface:#20242b;
  --surface-2:#2a2f37;
  --line:#343a44;
  --text:#eef1f5;
  --muted:#9aa2ad;
  --blue:#2b7fe0;
  --blue-deep:#1a4f96;
  --orange:#f5921e;
  --orange-deep:#c2551a;
  --font:"Archivo", "Arial Narrow", Arial, Helvetica, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- Encabezado ---------- */
.hero{position:relative;overflow:hidden;padding:28px 0 26px;border-bottom:1px solid var(--line)}
.hero::before,.hero::after{content:"";position:absolute;top:-40%;height:180%;width:140px;transform:skewX(-24deg);opacity:.14;pointer-events:none}
.hero::before{right:120px;background:linear-gradient(var(--blue),transparent)}
.hero::after{right:-10px;background:linear-gradient(var(--orange),transparent)}
.hero .wrap{display:flex;align-items:center;gap:18px;position:relative}
.logo{width:84px;height:auto;border-radius:10px;flex:none}
.hero h1{font-weight:900;font-style:italic;font-stretch:118%;text-transform:uppercase;font-size:clamp(1.55rem,5.4vw,2.9rem);line-height:.95;letter-spacing:-.01em}
.hero h1 span{display:block;color:var(--orange)}
.hero p{color:var(--muted);margin-top:8px;font-size:.95rem;max-width:46ch}

/* ---------- Filtros ---------- */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(22,25,30,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 0}
.filters .wrap{display:grid;gap:10px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.day{min-width:40px;padding:7px 0;text-align:center}
.chip.today-chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#1b1206}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);font:inherit;font-size:.95rem}
.search::placeholder{color:var(--muted)}
.top-row{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:760px){.top-row{grid-template-columns:auto 1fr;align-items:center}.search{max-width:320px;justify-self:end}}

/* ---------- Avisos ---------- */
.notice{margin:18px 0 0;padding:12px 14px;border-radius:10px;background:var(--surface);border-left:3px solid var(--orange);color:var(--muted);font-size:.9rem}
.count{color:var(--muted);font-size:.88rem;margin:18px 0 12px}

/* ---------- Tarjetas ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:18px;padding-bottom:48px}
@media (min-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}

.card{background:var(--surface);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.card.off-today .media{filter:grayscale(.85) brightness(.7)}
.media{position:relative;aspect-ratio:16/10;background:var(--surface-2)}
.media img{width:100%;height:100%;object-fit:cover}
.media .ph{position:absolute;inset:0;display:grid;place-items:center;background:
  linear-gradient(115deg,transparent 42%,rgba(245,146,30,.22) 42% 58%,transparent 58%),
  linear-gradient(115deg,rgba(43,127,224,.22) 0 30%,transparent 30%),var(--surface-2)}
.media .ph b{font-weight:900;font-style:italic;font-stretch:125%;font-size:3.4rem;color:rgba(255,255,255,.14);text-transform:uppercase}
.media::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(22,25,30,.75))}

/* El descuento es el protagonista */
.deal{position:absolute;left:14px;bottom:-18px;z-index:2;transform:skewX(-14deg);background:linear-gradient(100deg,var(--orange),var(--orange-deep));padding:4px 16px 2px;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.deal span{display:block;transform:skewX(14deg);font-weight:900;font-style:italic;font-stretch:115%;font-size:2.35rem;line-height:1.05;color:#fff;letter-spacing:-.02em}
.cat{position:absolute;right:12px;top:12px;z-index:2;background:rgba(22,25,30,.8);border-radius:6px;padding:3px 9px;font-size:.78rem;font-weight:600;color:var(--text)}

.body{padding:30px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h2{font-size:1.2rem;font-weight:800;font-stretch:105%;line-height:1.15}
.type{color:var(--muted);font-size:.93rem;margin-top:-6px}
.cond{font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}

.days{display:flex;gap:5px}
.days i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--surface-2);color:#5d6571}
.days i.on{background:var(--blue-deep);color:#fff}
.days i.today{box-shadow:0 0 0 2px var(--orange)}

.place{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px}
.addr{font-size:.9rem;color:var(--text);min-width:0}
.go{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;padding:8px 12px;border-radius:8px}
.go svg{width:16px;height:16px}

.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty button{margin-top:14px;background:var(--blue);border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;color:#fff}

.skeleton{height:330px;border-radius:14px;background:linear-gradient(100deg,var(--surface) 40%,var(--surface-2) 50%,var(--surface) 60%);background-size:300% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-150% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
</style>
</head>

<script>
/* =====================================================================
   CONFIGURACIÓN: pegá acá el link del CSV publicado de la planilla.
   (Archivo → Compartir → Publicar en la web → pestaña "Beneficios" → CSV)
   Mientras esté vacío, la página muestra datos de ejemplo.
   ===================================================================== */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSBQ3QuvzvCGjN7YVgw-kJVR2gpfCieW5ZhpKV1RkECg5KIAZbHMUgGYtZC7DAOdV9aRbbuofiYEYvi/pub?gid=0&single=true&output=csv";

/* ---------------- Utilidades ---------------- */
const dayRow=document.getElementById("dayRow"),catRow=document.getElementById("catRow"),grid=document.getElementById("grid"),count=document.getElementById("count"),notice=document.getElementById("notice");
const DAY_LETTERS = ["D","L","M","M","J","V","S"];            // índice = getDay()
const DAY_NAMES   = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const WEEK_ORDER  = [1,2,3,4,5,6,0];                            // de lunes a domingo
const CACHE_KEY   = "yx-beneficios-cache";

const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();

function parseCSV(text){
  const rows=[]; let row=[], field="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++} else q=false }
      else field+=c;
    }else if(c==='"') q=true;
    else if(c===','){ row.push(field); field="" }
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n') i++;
      row.push(field); rows.push(row); row=[]; field="";
    }else field+=c;
  }
  if(field!==""||row.length){ row.push(field); rows.push(row) }
  return rows.filter(r=>r.some(v=>v.trim()!==""));
}

/* Lee por NOMBRE de encabezado, así se pueden agregar o mover columnas */
function rowsToObjects(rows){
  const head = rows[0].map(h=>norm(h).replace(/\s+/g,"_"));
  return rows.slice(1).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??"").trim()])));
}
const pick = (o,...keys) => { for(const k of keys){ if(o[k]) return o[k] } return "" };

const DAY_TOKENS = {dom:0,domingo:0,lun:1,lunes:1,mar:2,martes:2,mie:3,miercoles:3,jue:4,jueves:4,vie:5,viernes:5,sab:6,sabado:6};
function parseDays(raw){
  const s = norm(raw);
  if(!s || /todos|siempre|todas/.test(s)) return [0,1,2,3,4,5,6];
  const set = new Set();
  if(/finde|fin de semana|fines de semana/.test(s)){ set.add(6); set.add(0) }
  if(/habiles|lunes a viernes|lun a vie|l a v/.test(s)) [1,2,3,4,5].forEach(d=>set.add(d));
  // rangos tipo "mar a jue"
  for(const m of s.matchAll(/([a-z]+)\s*(?:a|-)\s*([a-z]+)/g)){
    const a=DAY_TOKENS[m[1]], b=DAY_TOKENS[m[2]];
    if(a!==undefined && b!==undefined){
      const ia=WEEK_ORDER.indexOf(a), ib=WEEK_ORDER.indexOf(b);
      for(let i=ia;i<=ib;i++) set.add(WEEK_ORDER[i]);
    }
  }
  for(const t of s.split(/[^a-z]+/)) if(DAY_TOKENS[t]!==undefined) set.add(DAY_TOKENS[t]);
  return set.size ? [...set] : [0,1,2,3,4,5,6];
}

/* Convierte links de Drive ("compartir") en links de imagen que sí se muestran */
function imageUrl(u){
  if(!u) return "";
  if(/drive\.google\.com/.test(u)){
    const id = (u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/)||[])[1];
    if(id) return "https://drive.google.com/thumbnail?id="+id+"&sz=w800";
  }
  return u;
}
const fmtAmount = m => /^\d+([.,]\d+)?$/.test(m.trim()) ? m.trim()+"%" : m.trim();
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toBenefit(o){
  return {
    nombre: pick(o,"nombre","local","comercio"),
    categoria: pick(o,"categoria","rubro"),
    imagen: imageUrl(pick(o,"imagen_url","imagen","foto")),
    tipo: pick(o,"tipo_descuento","tipo","descripcion"),
    monto: fmtAmount(pick(o,"monto","descuento","monto_descuento")),
    direccion: pick(o,"direccion","ubicacion"),
    maps: pick(o,"maps_url","mapa","link_mapa"),
    dias: parseDays(pick(o,"dias","dias_activo")),
    condiciones: pick(o,"condiciones","notas","aclaraciones"),
    activo: !/^(no|n|false|0)$/.test(norm(pick(o,"activo")))
  };
}

/* ---------------- Datos de ejemplo ---------------- */
const DEMO = [
  {nombre:"Café del Parque",categoria:"Gastronomía",tipo_descuento:"En toda la carta",monto:"15",direccion:"Av. San Martín 1200, Mendoza",dias:"lunes a viernes",activo:"SI",condiciones:"Presentando la credencial de socio"},
  {nombre:"Nutri Market",categoria:"Salud",tipo_descuento:"En suplementos",monto:"10",direccion:"Belgrano 850, Godoy Cruz",dias:"todos",activo:"SI"},
  {nombre:"Bici Andes",categoria:"Deportes",tipo_descuento:"En service de bicicletas",monto:"20",direccion:"Ozamis 300, Maipú",dias:"findes",activo:"SI",condiciones:"No acumulable con otras promos"},
  {nombre:"Estudio Kine",categoria:"Salud",tipo_descuento:"En sesiones de kinesiología",monto:"25",direccion:"Colón 410, Mendoza",dias:"mar,jue",activo:"SI"},
  {nombre:"Punto Proteico",categoria:"Gastronomía",tipo_descuento:"En bowls y licuados",monto:"2x1",direccion:"Arístides Villanueva 520, Mendoza",dias:"miercoles",activo:"SI"}
];

/* ---------------- Estado y render ---------------- */
const today = new Date().getDay();
let all = [], dayFilter = "all", catFilter = "all", query = "";

function renderDayChips(){
  const opts = [["all","Todos"],["today","Hoy"]].concat(WEEK_ORDER.map(d=>[String(d),DAY_LETTERS[d]]));
  dayRow.innerHTML = opts.map(([v,l])=>{
    const cls = v==="today" ? "chip today-chip" : (v.length===1 ? "chip day" : "chip");
    const label = v.length===1 ? ' aria-label="'+DAY_NAMES[+v]+'"' : "";
    return '<button class="'+cls+'" data-v="'+v+'" aria-pressed="'+(dayFilter===v)+'"'+label+'>'+l+'</button>';
  }).join("");
}
function renderCatChips(){
  const cats = [...new Set(all.map(b=>b.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
  catRow.hidden = cats.length < 2;
  catRow.innerHTML = ["all",...cats].map(c=>
    '<button class="chip" data-v="'+esc(c)+'" aria-pressed="'+(catFilter===c)+'">'+(c==="all"?"Todas las categorías":esc(c))+'</button>').join("");
}

function card(b){
  const offToday = !b.dias.includes(today);
  const initial = esc((b.nombre||"?").charAt(0));
  const media = b.imagen
    ? '<img src="'+esc(b.imagen)+'" alt="'+esc(b.nombre)+'" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'ph\',innerHTML:\'<b>'+initial+'</b>\'}))">'
    : '<div class="ph"><b>'+initial+'</b></div>';
  const days = WEEK_ORDER.map(d=>'<i class="'+(b.dias.includes(d)?"on":"")+(d===today?" today":"")+'" title="'+DAY_NAMES[d]+'">'+DAY_LETTERS[d]+'</i>').join("");
  const daysLabel = b.dias.length===7 ? "Válido todos los días" : "Válido: "+WEEK_ORDER.filter(d=>b.dias.includes(d)).map(d=>DAY_NAMES[d]).join(", ");
  const mapsHref = b.maps || (b.direccion ? "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(b.direccion) : "");
  return '<article class="card'+(offToday?" off-today":"")+'">'+
    '<div class="media">'+media+
      (b.categoria?'<span class="cat">'+esc(b.categoria)+'</span>':'')+
      (b.monto?'<div class="deal"><span>'+esc(b.monto)+'</span></div>':'')+
    '</div>'+
    '<div class="body">'+
      '<h2>'+esc(b.nombre)+'</h2>'+
      (b.tipo?'<p class="type">'+esc(b.tipo)+'</p>':'')+
      '<div class="days" role="img" aria-label="'+daysLabel+'">'+days+'</div>'+
      (b.condiciones?'<p class="cond">'+esc(b.condiciones)+'</p>':'')+
      '<div class="place">'+
        '<span class="addr">'+esc(b.direccion)+'</span>'+
        (mapsHref?'<a class="go" href="'+esc(mapsHref)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Cómo llegar</a>':'')+
      '</div>'+
    '</div>'+
  '</article>';
}

function render(){
  const q = norm(query);
  const list = all.filter(b=>{
    if(dayFilter==="today" && !b.dias.includes(today)) return false;
    if(dayFilter.length===1 && !b.dias.includes(+dayFilter)) return false;
    if(catFilter!=="all" && b.categoria!==catFilter) return false;
    if(q && !norm([b.nombre,b.categoria,b.tipo,b.direccion].join(" ")).includes(q)) return false;
    return true;
  });
  count.textContent = list.length===1 ? "1 beneficio" : list.length+" beneficios";
  grid.innerHTML = list.length ? list.map(card).join("")
    : '<div class="empty" style="grid-column:1/-1"><p>Ningún beneficio coincide con esos filtros.</p><button id="reset">Ver todos los beneficios</button></div>';
}

function setData(objs){
  all = objs.map(toBenefit).filter(b=>b.activo && b.nombre);
  if(catFilter!=="all" && !all.some(b=>b.categoria===catFilter)) catFilter="all";
  renderCatChips(); render();
}

/* ---------------- Eventos ---------------- */
dayRow.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;dayFilter=b.dataset.v;renderDayChips();render()});
catRow.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;catFilter=b.dataset.v;renderCatChips();render()});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value;render()});
grid.addEventListener("click",e=>{if(e.target.id==="reset"){dayFilter="all";catFilter="all";query="";document.getElementById("q").value="";renderDayChips();renderCatChips();render()}});

/* ---------------- Carga ---------------- */
async function load(){
  renderDayChips();
  if(!SHEET_CSV_URL){
    notice.innerHTML='<p class="notice">Estás viendo datos de ejemplo. Pegá el link del CSV de la planilla en SHEET_CSV_URL (dentro de index.html) para mostrar los beneficios reales.</p>';
    setData(DEMO); return;
  }
  // Muestra al instante lo último que se cargó, y después actualiza
  let hadCache=false;
  try{const c=localStorage.getItem(CACHE_KEY);if(c){setData(JSON.parse(c));hadCache=true}}catch(e){}
  try{
    const sep = SHEET_CSV_URL.includes("?") ? "&" : "?";
    const res = await fetch(SHEET_CSV_URL+sep+"_="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const text = await res.text();
    if(/^\s*</.test(text)) throw new Error("no-csv");
    const objs = rowsToObjects(parseCSV(text));
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(objs))}catch(e){}
    notice.innerHTML=""; setData(objs);
  }catch(err){
    notice.innerHTML='<p class="notice">'+(hadCache
      ? "No se pudo actualizar la lista; se muestran los beneficios de la última visita."
      : "No se pudieron cargar los beneficios. Revisá que la planilla esté publicada en la web como CSV y que el link en SHEET_CSV_URL sea el correcto.")+'</p>';
    if(!hadCache){grid.innerHTML="";count.textContent=""}
  }
}
load();
</script>
